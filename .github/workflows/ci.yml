name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run rules

      - run: npm run core:check

      - run: npm run extension:check

      - run: npm test

      - run: npm run links

  browser:
    name: Watch party in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright-core install chromium

      - run: npm run e2e
        env:
          BROWSER: /usr/bin/google-chrome

      - run: npm run e2e:ext
        env:
          EXT_BROWSER: playwright
